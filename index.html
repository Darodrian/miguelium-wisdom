<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miguelium Wisdom</title>
<link rel="icon" href="data:,">
<style>
  @font-face {
    font-family: 'ComingSoon';
    src: url('./fonts/ComingSoon-Regular.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'ZPix';
    src: url('./fonts/zpix.woff2') format('woff2');
    font-display: swap;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
    pointer-events: none; padding-bottom: 6vh;
  }
  #actor {
    display: flex; flex-direction: column; align-items: center;
    opacity: 0; transform: scale(0.6) translateY(24px);
    transform-origin: 50% 100%;
    transition: opacity .3s ease, transform .3s ease;
  }
  #actor.on { opacity: 1; transform: none; }
  #actor.out { opacity: 0; transform: scale(0.92) translateY(10px); transition: opacity .4s ease, transform .4s ease; }
  #bubble {
    position: relative; max-width: min(620px, 72vw);
    padding: 14px 22px; margin-bottom: 16px;
    background: rgba(255,255,255,.96); color: #101010;
    border-radius: 16px; box-shadow: 0 8px 28px rgba(0,0,0,.38);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 22px; line-height: 1.35; text-align: center;
  }
  #bubble.style-grape { background: rgba(169, 149, 250, 0.96); color: #101010; }
  #bubble.style-grape::after { border-top-color: rgba(169, 149, 250, 0.96); }
  #bubble.style-sapphire { background: rgba(121, 146, 233, 0.96); color: #101010; }
  #bubble.style-sapphire::after { border-top-color: rgba(121, 146, 233, 0.96); }
  #bubble.style-ocean { background: rgba(151, 213, 253, 0.96); color: #101010; }
  #bubble.style-ocean::after { border-top-color: rgba(151, 213, 253, 0.96); }
  #bubble.style-emerald { background: rgba(146, 245, 186, 0.96); color: #101010; }
  #bubble.style-emerald::after { border-top-color: rgba(146, 245, 186, 0.96); }
  #bubble.style-green { background: rgba(150, 244, 68, 0.96); color: #101010; }
  #bubble.style-green::after { border-top-color: rgba(150, 244, 68, 0.96); }
  #bubble.style-snow { background: rgba(254, 251, 255, 0.96); color: #101010; }
  #bubble.style-snow::after { border-top-color: rgba(254, 251, 255, 0.96); }
  #bubble.style-carbon { background: rgba(105, 104, 106, 0.96); color: #fff; }
  #bubble.style-carbon::after { border-top-color: rgba(105, 104, 106, 0.96); }
  #bubble.style-orange { background: rgba(240, 173, 49, 0.96); color: #101010; }
  #bubble.style-orange::after { border-top-color: rgba(240, 173, 49, 0.96); }
  #bubble.style-chocolate { background: rgba(195, 125, 93, 0.96); color: #fff; }
  #bubble.style-chocolate::after { border-top-color: rgba(195, 125, 93, 0.96); }
  #bubble.style-cherry { background: rgba(237, 145, 215, 0.96); color: #101010; }
  #bubble.style-cherry::after { border-top-color: rgba(237, 145, 215, 0.96); }
  #bubble.style-red { background: rgba(228, 50, 54, 0.96); color: #fff; }
  #bubble.style-red::after { border-top-color: rgba(228, 50, 54, 0.96); }
  #bubble.style-yellow { background: rgba(246, 206, 50, 0.96); color: #101010; }
  #bubble.style-yellow::after { border-top-color: rgba(246, 206, 50, 0.96); }
  #bubble.style-chalk { background: rgba(217, 215, 218, 0.96); color: #101010; }
  #bubble.style-chalk::after { border-top-color: rgba(217, 215, 218, 0.96); }
  #bubble::after {
    content: ''; position: absolute; bottom: -14px; left: 50%;
    transform: translateX(-50%); border: 14px solid transparent;
    border-top-color: rgba(255,255,255,.96); border-bottom: none;
  }
  #img-mig {
    height: 38vh; max-height: 430px; width: auto;
    filter: drop-shadow(0 12px 22px rgba(0,0,0,.45));
    transition: scale .25s ease;
  }
  @keyframes swing {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-4px) scale(1.02); }
  }
  .movement-swing #img-mig { animation: swing 0.4s ease-in-out infinite; }
  .movement-bob #img-mig { animation: bob 0.4s ease-in-out infinite; }
  #img-mig.flip { scale: -1 1; }

  /* Preview mode: scale down the overlay so character and bubble fit inside the dashboard iframe */
  body.preview-mode #stage {
    transform: scale(0.65);
    transform-origin: center;
    align-items: center;
    width: 100%;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="actor">
    <div id="bubble"><span id="text"></span></div>
    <img id="img-mig" src="assets/miguelium.png" alt="Miguelium">
  </div>
</div>

<script type="module">
import {
  cfg, configured, saveAmount, createBridge,
} from './js/bridge.js';
import { getAccessToken, EventSubClient } from './js/twitch.js';
import { fetchCheerState, fetchCharacterState } from './js/cloud.js';
import { speak, loadEngine, unlockAudio, setMuted } from './js/tts.js';
import { forSpeech, schedulePacing } from './js/speech.js';
import {
  CHARACTER_MIGUELIUM, CHARACTER_ROWLET, CHARACTERS,
  readAllSettings, saveAllSettings, defaultAmountFor, migrateLegacyCharacter, isValidCharacter,
} from './js/characters.js';

const BROADCASTER_ID = (() => {
  try { return new URLSearchParams(location.search).get('broadcaster_id') || ''; } catch { return ''; }
})();
// El preview del panel es una instancia mas del overlay. No abre un EventSub
// propio para no competir por la suscripcion con el overlay de OBS.
const PREVIEW_MODE = (() => {
  try { return new URLSearchParams(location.search).get('preview') === '1'; } catch { return false; }
})();
if (PREVIEW_MODE) document.body.classList.add('preview-mode');
const $ = (id) => document.getElementById(id);

const TYPE_MS = cfg.typeMs ?? 35;
const LINGER_MS = cfg.lingerMs ?? 10000;
const FADE_MS = cfg.fadeMs ?? 400;
// Si el motor de voz no contesta en este tiempo, el globo escribe igual sin sonido.
const VOICE_GRACE_MS = 2500;

const actor = $('actor');
const textEl = $('text');
const bubbleEl = $('bubble');
const migEl = $('img-mig');

// Cada personaje tiene su propio umbral, apariencia y voz.
migrateLegacyCharacter(BROADCASTER_ID);
const settings = {};
for (const c of [CHARACTER_MIGUELIUM, CHARACTER_ROWLET]) {
  settings[c] = readAllSettings(BROADCASTER_ID, c);
  if (settings[c].amount === undefined || settings[c].amount <= 0) {
    settings[c].amount = defaultAmountFor(BROADCASTER_ID, c);
  }
}

let phrases = [];
// Historial de índices de frases recientes por personaje (no repeticiones cercanas).
const recentIndices = {};
for (const c of [CHARACTER_MIGUELIUM, CHARACTER_ROWLET]) recentIndices[c] = [];

let showing = false;
let hideTimer = null;
let typeTimer = null;
let paceCancel = null;
let helloTimer = null;
const queue = [];

function applyFontFor(character) {
  const s = settings[character] || settings[CHARACTER_MIGUELIUM];
  textEl.style.fontFamily = s.font;
  textEl.style.fontSize = s.fontSize + 'px';
}

function applyStyleFor(character) {
  const s = settings[character] || settings[CHARACTER_MIGUELIUM];
  bubbleEl.classList.remove('style-default', 'style-grape', 'style-sapphire', 'style-ocean', 'style-emerald', 'style-green', 'style-snow', 'style-carbon', 'style-orange', 'style-chocolate', 'style-cherry', 'style-red', 'style-yellow', 'style-chalk');
  bubbleEl.classList.add('style-' + s.palette);
}

function applyMovementFor(character) {
  const s = settings[character] || settings[CHARACTER_MIGUELIUM];
  actor.classList.remove('movement-off', 'movement-swing', 'movement-bob');
  actor.classList.add('movement-' + s.movement);
}

function applyCharacterFor(character) {
  const c = CHARACTERS[character] || CHARACTERS[CHARACTER_MIGUELIUM];
  migEl.src = c.src;
  migEl.alt = c.alt;
}

function applyFlipFor(character) {
  const s = settings[character] || settings[CHARACTER_MIGUELIUM];
  migEl.classList.toggle('flip', s.flip);
}

async function loadCheerThreshold() {
  if (!BROADCASTER_ID) return;
  // Nombrado: la tabla propia de sabiduria por personaje tiene prioridad.
  try {
    const rows = await fetchCharacterState(BROADCASTER_ID);
    if (rows && Array.isArray(rows) && rows.length) {
      for (const row of rows) {
        if (row.character && Number.isFinite(row.amount) && row.amount > 0) {
          settings[row.character].amount = Math.floor(row.amount);
        }
      }
      return;
    }
  } catch (e) {
    console.warn('[overlay] tabla de personajes no disponible aun', (e && e.message) || e);
  }
  // Fallback al umbral unico legado (solo miguelium) mientras no se migre.
  try {
    const cloud = await fetchCheerState(BROADCASTER_ID);
    if (cloud && Number.isFinite(cloud.cheer_threshold) && cloud.cheer_threshold > 0) {
      const n = Math.floor(cloud.cheer_threshold);
      settings[CHARACTER_MIGUELIUM].amount = n;
      saveAmount(BROADCASTER_ID, n);
    }
  } catch (e) {
    console.warn('[overlay] cloud cheer state unavailable, using localStorage', (e && e.message) || e);
  }
}

// Se guarda la promesa para que el primer cheer espere el umbral de la nube
// en vez de compararlo contra el valor por defecto de localStorage.
const cheerThresholdReady = loadCheerThreshold();
const HISTORY_SIZE = 20;

async function loadPhrases() {
  try {
    const res = await fetch('refranes.json');
    if (res.ok) {
      const data = await res.json();
      if (data && typeof data === 'object' && !Array.isArray(data)) {
        phrases = {};
        for (const c of [CHARACTER_MIGUELIUM, CHARACTER_ROWLET]) {
          const arr = data[c];
          if (Array.isArray(arr)) {
            phrases[c] = arr.filter((s) => typeof s === 'string' && s.trim()).map((s) => s.trim());
          } else {
            phrases[c] = [];
          }
        }
      }
    }
  } catch (e) { /* sin lista */ }
}

function pickPhrase(character) {
  const list = phrases[character];
  if (!list || !list.length) return '...';
  if (list.length === 1) return list[0];

  const recent = recentIndices[character] || [];

  // Intenta hasta list.length veces encontrar un índice no reciente.
  let i;
  for (let attempt = 0; attempt < list.length; attempt++) {
    i = Math.floor(Math.random() * list.length);
    if (!recent.includes(i)) break;
  }

  recent.push(i);
  if (recent.length > HISTORY_SIZE) {
    recent.shift();
  }
  recentIndices[character] = recent;
  return list[i];
}

function enqueue(character) {
  console.log('[overlay] enqueue called, character:', character, 'queue length before:', queue.length);
  queue.push({ character, phrase: pickPhrase(character) });
  next();
}

function next() {
  console.log('[overlay] next called, showing:', showing, 'queue length:', queue.length);
  if (showing || !queue.length) {
    console.log('[overlay] next returning early');
    return;
  }
  showing = true;
  const job = queue.shift();
  console.log('[overlay] next shifting job, character:', job.character, 'phrase:', job.phrase);
  show(job);
}

function stopFx() {
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
  if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
  if (paceCancel) { paceCancel(); paceCancel = null; }
}

function show(job) {
  console.log('[overlay] show called, character:', job.character, 'phrase:', job.phrase);
  stopFx();
  textEl.textContent = '';

  // Aplica el aspecto propio del personaje antes de entrar.
  applyCharacterFor(job.character);
  applyFontFor(job.character);
  applyStyleFor(job.character);
  applyMovementFor(job.character);
  applyFlipFor(job.character);

  actor.classList.remove('out');
  // Fuerza un repintado para que la transicion de entrada siempre se vea.
  void actor.offsetWidth;
  actor.classList.add('on');

  const startTyping = (perChar) => {
    console.log('[overlay] startTyping called, perChar:', perChar);
    let i = 0;
    typeTimer = setInterval(() => {
      i++;
      textEl.textContent = job.phrase.slice(0, i);
      if (i >= job.phrase.length) {
        stopFx();
        hideTimer = setTimeout(() => {
          actor.classList.add('out');
          hideTimer = setTimeout(() => {
            actor.classList.remove('on', 'out');
            showing = false;
            next();
          }, FADE_MS);
        }, LINGER_MS);
      }
    }, perChar);
  };

  // El globo se escribe al ritmo del audio del personaje; si la voz falla o
  // no contesta, cae al ritmo fijo TYPE_MS y el overlay sigue funcionando sin sonido.
  paceCancel = schedulePacing({
    text: forSpeech(job.phrase),
    speak: (text, opts) => speak(text, { ...opts, character: job.character }),
    fallbackPerChar: TYPE_MS,
    graceMs: VOICE_GRACE_MS,
    onPace: startTyping,
    character: job.character,
  });
}

// Cheers oficiales via Twitch EventSub (reemplaza ComfyJS).
let eventSub = null;
let eventSubStarting = false;
let bridge;

async function startEventSub() {
  if (!BROADCASTER_ID || PREVIEW_MODE || eventSub || eventSubStarting) return;
  eventSubStarting = true;
  let delay = 5000;
  try {
    while (!eventSub) {
      try {
        const token = await getAccessToken(BROADCASTER_ID);
        eventSub = new EventSubClient(BROADCASTER_ID, async (event) => {
          await cheerThresholdReady;
          const bits = Number(event && event.bits);
          let matched = null;
          if (Number.isFinite(bits) && bits > 0) {
            if (bits === settings[CHARACTER_MIGUELIUM].amount) matched = CHARACTER_MIGUELIUM;
            else if (bits === settings[CHARACTER_ROWLET].amount) matched = CHARACTER_ROWLET;
          }
          if (matched) {
            enqueue(matched);
            bridge.sendCheer({ user: event && event.user_name, bits, character: matched });
          }
        }, () => {
          showAffiliateRequired();
        });
        eventSub.connect(token);
        return;
      } catch (e) {
        console.warn('[eventsub] start failed; reintentando', (e && e.message) || e);
        // Token revocado (logout real): no hay nada que reintentar.
        const msg = (e && e.message) || '';
        if (msg.includes('(404)') || msg.includes('no_token')) return;
        await new Promise((r) => setTimeout(r, delay));
        delay = Math.min(delay * 2, 60000);
      }
    }
  } finally {
    eventSubStarting = false;
  }
}

function showAffiliateRequired() {
  // Muestra un aviso en el overlay de que los cheers requieren Afiliado/Partner.
  const notice = document.createElement('div');
  notice.id = 'affiliate-notice';
  notice.textContent = 'Los cheers requieren que el canal sea Afiliado o Partner de Twitch.';
  Object.assign(notice.style, {
    position: 'fixed', top: '10px', left: '50%', transform: 'translateX(-50%)',
    background: 'rgba(255, 0, 0, 0.9)', color: '#fff', padding: '8px 16px',
    borderRadius: '8px', fontSize: '14px', zIndex: 9999, pointerEvents: 'none'
  });
  document.body.appendChild(notice);
  setTimeout(() => notice.remove(), 8000);
}

if (configured() && BROADCASTER_ID) {
  bridge = createBridge(BROADCASTER_ID);
  function applyIncomingSet(p) {
    const character = p && isValidCharacter(p.character) ? p.character : CHARACTER_MIGUELIUM;
    const nextSettings = { ...settings[character] };
    let changed = false;

    const n = Number(p && p.amount);
    if (Number.isFinite(n) && n > 0) {
      nextSettings.amount = Math.floor(n);
      // El umbral legado mw_amount_<id> semilla a miguelium; no lo sobreescribe
      // con el umbral de otro personaje.
      if (character === CHARACTER_MIGUELIUM) {
        saveAmount(BROADCASTER_ID, nextSettings.amount);
      }
      changed = true;
    }
    if (p && p.font !== undefined) { nextSettings.font = p.font; changed = true; }
    if (p && p.fontSize !== undefined) { nextSettings.fontSize = Number(p.fontSize) || nextSettings.fontSize; changed = true; }
    if (p && p.movement !== undefined) { nextSettings.movement = p.movement; changed = true; }
    if (p && p.palette !== undefined) { nextSettings.palette = p.palette; changed = true; }
    if (p && typeof p.flip === 'boolean') { nextSettings.flip = !!p.flip; changed = true; }

    if (changed) {
      settings[character] = nextSettings;
      saveAllSettings(BROADCASTER_ID, character, nextSettings);
      // Si este personaje es el que esta en escena, refresca su aspecto al instante.
      // (solo uno muestra a la vez, asi que no hay conflicto)
      if (document.getElementById('img-mig').src.includes(CHARACTERS[character].src)) {
        applyFontFor(character);
        applyStyleFor(character);
        applyMovementFor(character);
        applyFlipFor(character);
      }
    }
  }

  bridge.onSet((p) => applyIncomingSet(p));
  bridge.onFlip((p) => {
    if (p && typeof p.flip === 'boolean') {
      const character = isValidCharacter(p.character) ? p.character : CHARACTER_MIGUELIUM;
      const next = { ...settings[character], flip: !!p.flip };
      settings[character] = next;
      saveAllSettings(BROADCASTER_ID, character, next);
      applyFlipFor(character);
    }
  });
  bridge.onDisconnect(() => {
    // El panel desconectó: ocultar el actor y detener la cola.
    // Desconectar EventSub para dejar de recibir cheers oficiales.
    if (eventSub) {
      eventSub.disconnect();
      eventSub = null;
    }
    stopFx();
    actor.classList.remove('on');
    actor.classList.add('out');
    setTimeout(() => {
      actor.classList.remove('on', 'out');
      showing = false;
    }, FADE_MS);
    document.title = 'Miguelium Wisdom · Desconectado';
  });
  bridge.onTest((p) => {
    const character = p && isValidCharacter(p.character) ? p.character : CHARACTER_MIGUELIUM;
    enqueue(character);
  });
  // El preview refleja los cheers que detecta el overlay real y los publica
  // en la sala; asi se ve igual sin abrir una segunda suscripcion de EventSub.
  if (PREVIEW_MODE) bridge.onCheer((p) => {
    const character = p && isValidCharacter(p.character) ? p.character : CHARACTER_MIGUELIUM;
    enqueue(character);
  });
  bridge.onPing(() => {
    bridge.sendHello();
    // El panel volvio a la sala (p.ej. tras Desconectar): reactivar EventSub
    // para que el overlay no quede sordo hasta el proximo reload.
    if (!eventSub) startEventSub();
  });
  bridge.onStatus((s) => {
    if (s === 'SUBSCRIBED') {
      bridge.sendHello();
      if (!helloTimer) helloTimer = setInterval(() => bridge.sendHello(), 25000);
    }
  });
  bridge.connect().catch((e) => {
    console.error('Miguelium: sala', (e && e.message) || e);
  });

  if (!PREVIEW_MODE) startEventSub();
} else {
  console.warn('Miguelium: sin broadcaster_id — solo reacciones sin sincronizacion');
}

// Boton Test del panel: dispara el overlay en la misma pagina.
window.addEventListener('message', (ev) => {
  if (ev.origin !== location.origin) return;
  const d = ev.data;
  if (d && d.type === 'test') {
    const character = d && isValidCharacter(d.character) ? d.character : CHARACTER_MIGUELIUM;
    enqueue(character);
  } else if (d && d.type === 'mute') setMuted(!!d.value);
});

unlockAudio();
loadEngine().catch((e) => console.warn('Miguelium: motor de voz no disponible', (e && e.message) || e));
loadPhrases();
</script>
</body>
</html>
