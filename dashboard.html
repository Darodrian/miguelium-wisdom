<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miguelium Wisdom · Control</title>
<link rel="icon" href="data:,">
<style>
  @font-face {
    font-family: 'ComingSoon';
    src: url('./fonts/ComingSoon-Regular.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'ZPix';
    src: url('./fonts/zpix.woff2') format('woff2');
    font-display: swap;
  }
  :root {
    --panel: rgba(16, 24, 39, 0.72);
    --line: rgba(255, 255, 255, 0.08);
    --text: #e8ecf4;
    --muted: #93a0b8;
    --accent: #ffd34d;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px; min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: #0b1018;
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  h2 { margin: 0 0 12px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); }
  .wrap { display: grid; grid-template-columns: 340px 1fr; gap: 18px; max-width: 1100px; margin: 0 auto; align-items: start; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .msg { font-size: 12px; color: var(--accent); min-height: 16px; margin-top: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #64748b; flex: 0 0 auto; }
  .dot.live { background: #34d399; }
  .dot.busy { background: var(--accent); }
  .dot.err { background: var(--danger); }
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  input, .keybar code {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  input {
    padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,0.06); color: var(--text); font-size: 14px;
    outline: none; transition: border-color .15s ease;
  }
  input:focus { border-color: rgba(255,211,77,0.55); }
  input[type="checkbox"] { width: auto; padding: 0; border: 0; background: none; accent-color: var(--accent); flex: 0 0 auto; }
  .row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1 1 0; }
  button {
    padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,0.06); color: var(--text); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: background .15s ease, border-color .15s ease;
  }
  button:hover:not(:disabled) { background: rgba(255,211,77,0.16); border-color: rgba(255,211,77,0.35); }
  button:disabled { opacity: 0.35; cursor: default; }
  .seg button.on { background: rgba(255,211,77,0.18); border-color: rgba(255,211,77,0.45); color: var(--accent); }
  .keybar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 12px; color: var(--muted);
  }
  .keybar code { color: var(--accent); word-break: break-all; }
  .keybar button { padding: 5px 10px; font-size: 11px; }
  .keybar .none { font-style: italic; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.5; }
  #preview-shell { position: relative; width: 100%; height: 300px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #000; }
  #preview { width: 100%; height: 100%; border: 0; display: block; }
  #events { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  #events li { color: var(--muted); }
  #events li.ok { color: #34d399; }
  #events .empty { font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex; flex-direction:column; gap:18px;">
    <div>
      <h1>Miguelium Wisdom</h1>
      <div class="status"><span class="dot" id="dot-ov"></span><span id="status-ov">Sin canal</span></div>
      <div class="msg" id="msg" hidden></div>
    </div>

    <div id="connection-panel" class="panel">
      <h2 id="connection-title">Conectar Twitch</h2>
      <button type="button" id="btn-connect">Conectar cuenta de Twitch</button>
      <div id="connection-connected" hidden>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <span id="connection-status">Conectado</span>
          <button type="button" id="btn-logout" style="margin-left:auto;">Desconectar</button>
        </div>
        <button type="button" id="btn-copy-url" disabled style="margin-top:8px;">Copiar URL de OBS</button>
      </div>
    </div>
    <div class="panel">
      <h2>Vista</h2>
      <label class="row"><input id="test-overlay" type="checkbox" checked> Mostrar tambien en el overlay de OBS</label>
      <label class="row"><input id="mute-preview" type="checkbox"> Silenciar voz del preview</label>
    </div>

    <div id="settings-sections" hidden>
      <div class="panel" id="settings-miguelium">
        <h2>Miguelium</h2>
        <label class="field">Bits para activar
          <div class="row">
            <input id="amount-miguelium" type="number" min="1" step="1" style="flex:1" value="100">
            <button id="btn-save-miguelium" type="button">Guardar</button>
          </div>
        </label>
        <label class="field">Fuente
          <select id="font-miguelium">
            <option value="Georgia">Georgia (por defecto)</option>
            <option value="ComingSoon">Coming Soon</option>
            <option value="ZPix">ZPix</option>
          </select>
        </label>
        <label class="field">Tamaño de fuente (px)
          <input id="font-size-miguelium" type="number" min="12" max="72" step="2" value="22">
        </label>
        <label class="field">Movimiento al hablar
          <select id="movement-miguelium">
            <option value="off">Sin movimiento</option>
            <option value="swing">Balanceo</option>
            <option value="bob">Subir y bajar</option>
          </select>
        </label>
        <label class="field">Paleta de colores
          <select id="palette-miguelium">
            <option value="default">Por defecto</option>
            <option value="grape">Grape</option>
            <option value="sapphire">Sapphire</option>
            <option value="ocean">Ocean</option>
            <option value="emerald">Emerald</option>
            <option value="green">Green</option>
            <option value="snow">Snow</option>
            <option value="carbon">Carbon</option>
            <option value="orange">Orange</option>
            <option value="chocolate">Chocolate</option>
            <option value="cherry">Cherry</option>
            <option value="red">Red</option>
            <option value="yellow">Yellow</option>
            <option value="chalk">Chalk</option>
          </select>
        </label>
        <label class="row"><input id="flip-miguelium" type="checkbox"> Voltear horizontal</label>
        <button id="btn-test-miguelium" type="button">Probar Miguelium</button>
      </div>

      <div class="panel" id="settings-ms-rowlet">
        <h2>Ms. Rowlet</h2>
        <label class="field">Bits para activar
          <div class="row">
            <input id="amount-ms-rowlet" type="number" min="1" step="1" style="flex:1" value="100">
            <button id="btn-save-ms-rowlet" type="button">Guardar</button>
          </div>
        </label>
        <label class="field">Fuente
          <select id="font-ms-rowlet">
            <option value="Georgia">Georgia (por defecto)</option>
            <option value="ComingSoon">Coming Soon</option>
            <option value="ZPix">ZPix</option>
          </select>
        </label>
        <label class="field">Tamaño de fuente (px)
          <input id="font-size-ms-rowlet" type="number" min="12" max="72" step="2" value="22">
        </label>
        <label class="field">Movimiento al hablar
          <select id="movement-ms-rowlet">
            <option value="off">Sin movimiento</option>
            <option value="swing">Balanceo</option>
            <option value="bob">Subir y bajar</option>
          </select>
        </label>
        <label class="field">Paleta de colores
          <select id="palette-ms-rowlet">
            <option value="default">Por defecto</option>
            <option value="grape">Grape</option>
            <option value="sapphire">Sapphire</option>
            <option value="ocean">Ocean</option>
            <option value="emerald">Emerald</option>
            <option value="green">Green</option>
            <option value="snow">Snow</option>
            <option value="carbon">Carbon</option>
            <option value="orange">Orange</option>
            <option value="chocolate">Chocolate</option>
            <option value="cherry">Cherry</option>
            <option value="red">Red</option>
            <option value="yellow">Yellow</option>
            <option value="chalk">Chalk</option>
          </select>
        </label>
        <label class="row"><input id="flip-ms-rowlet" type="checkbox"> Voltear horizontal</label>
        <button id="btn-test-ms-rowlet" type="button">Probar Ms. Rowlet</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Vista previa</h2>
    <div id="preview-shell"><iframe id="preview" title="Vista previa del overlay" hidden></iframe></div>
    <p class="note" id="preview-note">Genera una clave para ver aqui el mismo overlay que se pone en OBS.</p>
    <div class="panel">
      <h2>Eventos</h2>
      <ul id="events"><li class="empty">Esperando cheers...</li></ul>
    </div>
  </div>
</div>

<script type="module">
import {
  cfg, configured, savedAmount, createBridge,
  savedPreviewMute, savePreviewMute,
} from './js/bridge.js';
import { TWITCH_OAUTH_BASE, SUPABASE_KEY } from './js/config.js';
import {
  CHARACTER_MIGUELIUM, CHARACTER_ROWLET,
  readAllSettings, saveAllSettings, defaultAmountFor,
} from './js/characters.js';
import { fetchCharacterState, saveCharacterState } from './js/cloud.js';

const $ = (id) => document.getElementById(id);
const DOT_OV = $('dot-ov'), STATUS_OV = $('status-ov');
const BTN_CONNECT = $('btn-connect'), BTN_COPY_URL = $('btn-copy-url');
const BTN_LOGOUT = $('btn-logout');
const TEST_OVERLAY = $('test-overlay');
const MUTE_PREVIEW = $('mute-preview');

// Controles por personaje (id del sufijo: -miguelium / -ms-rowlet).
function ctrl(character, kind) {
  return $(kind + '-' + character);
}
const PREVIEW = $('preview'), PREVIEW_NOTE = $('preview-note'), EVENTS = $('events'), MSG = $('msg');
const CONNECTION_PANEL = $('connection-panel'), CONNECTION_CONNECTED = $('connection-connected');
const CONNECTION_TITLE = $('connection-title'), CONNECTION_STATUS = $('connection-status');

const DEFAULT_AMOUNT = 100;
const OVERLAY_TTL = 90000;

let broadcasterId = '';
let broadcasterLogin = '';
// Ajustes por personaje, fuente de verdad compartida con el overlay.
let settings = {};
settings[CHARACTER_MIGUELIUM] = readAllSettings('', CHARACTER_MIGUELIUM);
settings[CHARACTER_ROWLET] = readAllSettings('', CHARACTER_ROWLET);
let lastHello = 0;
let roomActive = false;
let roomBridge = null;
let roomGen = 0;
let flashTimer = null;

function setOverlay(kind, text) { DOT_OV.className = 'dot' + (kind ? ' ' + kind : ''); STATUS_OV.textContent = text; }

function flash(text) {
  MSG.textContent = text;
  MSG.hidden = false;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => {
    MSG.hidden = true;
    MSG.textContent = '';
  }, 5000);
}

const CHARACTER_LABELS = { [CHARACTER_MIGUELIUM]: 'Miguelium', [CHARACTER_ROWLET]: 'Ms. Rowlet' };

// Escribe los ajustes en memoria en los controles del panel.
function applySettingsToControls() {
  for (const c of [CHARACTER_MIGUELIUM, CHARACTER_ROWLET]) {
    const s = settings[c];
    ctrl(c, 'amount').value = s.amount;
    ctrl(c, 'font').value = s.font;
    ctrl(c, 'font-size').value = s.fontSize;
    ctrl(c, 'movement').value = s.movement;
    ctrl(c, 'palette').value = s.palette;
    ctrl(c, 'flip').checked = !!s.flip;
  }
}

// Lee los controles de un personaje y los guarda en settings[c].
function readControlsIntoSettings(c) {
  const s = settings[c];
  s.amount = Math.max(1, Math.floor(Number(ctrl(c, 'amount').value) || DEFAULT_AMOUNT));
  s.font = ctrl(c, 'font').value;
  s.fontSize = Math.max(12, Math.floor(Number(ctrl(c, 'font-size').value) || 22));
  s.movement = ctrl(c, 'movement').value;
  s.palette = ctrl(c, 'palette').value;
  s.flip = ctrl(c, 'flip').checked;
  return s;
}

// Guarda los ajustes de un personaje: valida que los umbrales no coincidan,
// persiste en localStorage y se lo notifica al overlay.
async function saveCharacterSettings(c) {
  const s = readControlsIntoSettings(c);
  const other = c === CHARACTER_MIGUELIUM ? CHARACTER_ROWLET : CHARACTER_MIGUELIUM;
  if (s.amount === settings[other].amount) {
    flash('Miguelium y Ms. Rowlet no pueden tener el mismo umbral de bits');
    applySettingsToControls();
    return false;
  }
  settings[c] = s;
  saveAllSettings(broadcasterId || '', c, s);
  applySettingsToControls();
  if (broadcasterId) {
    try { await saveCharacterState(broadcasterId, c, s); } catch (e) {
      console.warn('[dashboard] cloud character state save failed', e?.message ?? e);
    }
  }
  if (roomBridge) roomBridge.sendSet({ character: c, ...s });
  return true;
}

function wireCharacterControls(c) {
  ctrl(c, 'amount').addEventListener('change', () => saveCharacterSettings(c));
  ctrl(c, 'font').addEventListener('change', () => { saveCharacterSettings(c); });
  ctrl(c, 'font-size').addEventListener('change', () => { saveCharacterSettings(c); });
  ctrl(c, 'movement').addEventListener('change', () => { saveCharacterSettings(c); });
  ctrl(c, 'palette').addEventListener('change', () => { saveCharacterSettings(c); });
  ctrl(c, 'flip').addEventListener('change', () => { saveCharacterSettings(c); });
  $('btn-save-' + c).addEventListener('click', () => saveCharacterSettings(c));
  $('btn-test-' + c).addEventListener('click', () => {
    readControlsIntoSettings(c);
    if (roomBridge && roomActive) roomBridge.sendTest(c);
  });
}

function wireAllControls() {
  wireCharacterControls(CHARACTER_MIGUELIUM);
  wireCharacterControls(CHARACTER_ROWLET);
}

// Lee siempre de localStorage (fuente de verdad compartida entre pestañas y overlay)
// para que una variable en memoria desactualizada no resucite un valor viejo.
function readSettings() {
  const out = {};
  for (const c of [CHARACTER_MIGUELIUM, CHARACTER_ROWLET]) {
    out[c] = readAllSettings('', c);
    if (out[c].amount <= 0) out[c].amount = defaultAmountFor('', c);
  }
  return out;
}

function broadcastSettings() {
  if (!roomBridge) return;
  const next = readSettings();
  settings[CHARACTER_MIGUELIUM] = next[CHARACTER_MIGUELIUM];
  settings[CHARACTER_ROWLET] = next[CHARACTER_ROWLET];
  roomBridge.sendSet({ character: CHARACTER_MIGUELIUM, ...next[CHARACTER_MIGUELIUM] });
  roomBridge.sendSet({ character: CHARACTER_ROWLET, ...next[CHARACTER_ROWLET] });
}

function showConnected(connected) {
  if (CONNECTION_PANEL) CONNECTION_PANEL.hidden = false;
  if (CONNECTION_TITLE) CONNECTION_TITLE.textContent = connected ? 'Conectado' : 'Conectar Twitch';
  if (BTN_CONNECT) BTN_CONNECT.hidden = connected;
  if (CONNECTION_CONNECTED) CONNECTION_CONNECTED.hidden = !connected;
  if (BTN_COPY_URL) BTN_COPY_URL.disabled = !connected;
  if (CONNECTION_STATUS) {
    CONNECTION_STATUS.textContent = connected ? ('Conectado: ' + broadcasterLogin) : '';
  }
  const SETTINGS_WRAPPER = $('settings-sections');
  if (SETTINGS_WRAPPER) SETTINGS_WRAPPER.hidden = !connected;
  setOverlay(connected ? 'live' : '', connected ? ('Canal: ' + broadcasterLogin) : 'Sin canal');
}

function buildOverlayUrl(broadcasterId) {
  const base = new URL('index.html', location.href);
  base.search = 'broadcaster_id=' + encodeURIComponent(broadcasterId);
  return base.href;
}

// El preview no abre EventSub: recibe los cheers del overlay real por la sala.
function buildPreviewUrl(broadcasterId) {
  const url = new URL(buildOverlayUrl(broadcasterId));
  url.searchParams.set('preview', '1');
  return url.href;
}

function updatePreview() {
  if (broadcasterId) {
    PREVIEW.src = buildPreviewUrl(broadcasterId);
    PREVIEW.hidden = false;
    PREVIEW_NOTE.textContent = 'Preview en vivo: lo que veas aqui es lo que se pone en OBS.';
  } else {
    PREVIEW.hidden = true;
    PREVIEW_NOTE.textContent = 'Conecta tu cuenta de Twitch para ver el overlay en el preview.';
  }
}

function logEvent(user, bits, character) {
  const label = character ? ('[' + (CHARACTER_LABELS[character] || character) + '] ') : '';
  const active = settings[character] ? settings[character].amount : savedAmount(broadcasterId, DEFAULT_AMOUNT);
  const ok = bits === active;
  if (EVENTS.querySelector('.empty')) EVENTS.textContent = '';
  const li = document.createElement('li');
  li.className = ok ? 'ok' : '';
  li.textContent = (ok ? '✔ ' : '✘ ') + label + user + ' · ' + bits + ' bits' + (ok ? ' — redimido' : ' — ignorado');
  EVENTS.prepend(li);
  while (EVENTS.children.length > 5) EVENTS.lastChild.remove();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e2) { /* sin portapapeles */ }
    ta.remove();
  }
}

async function startRoom() {
  const gen = ++roomGen;
  if (roomBridge) { await roomBridge.leave(); roomBridge = null; }
  roomActive = false;
  lastHello = 0;
  if (gen !== roomGen) return;
  if (!configured() || !broadcasterId) { setOverlay('', 'Sin canal'); return; }
  setOverlay('busy', 'Conectando...');
  try {
    roomBridge = createBridge(broadcasterId);
    roomBridge.onStatus((s) => {
      if (s === 'CHANNEL_ERROR') setOverlay('err', 'Error de conexion');
      else if (s === 'TIMED_OUT') setOverlay('err', 'Sin respuesta');
      else if (s === 'CLOSED') setOverlay('', 'Sala cerrada');
    });
    roomBridge.onHello(() => {
      lastHello = Date.now();
      setOverlay('live', 'Overlay conectado');
      broadcastSettings();
    });
    roomBridge.onCheer(({ user, bits, character }) => logEvent(user, bits, character));
    await roomBridge.connect();
    if (gen !== roomGen) return;
    roomActive = true;
    lastHello = Date.now();
    roomBridge.sendPing();
  } catch (e) {
    if (gen !== roomGen) return;
    const m = (e && e.message) || '';
    console.error('[dashboard] room connect failed', e);
    setOverlay('err', m === 'CHANNEL_ERROR' ? 'Error de conexion' : m === 'TIMED_OUT' ? 'Sin respuesta' : 'No se pudo conectar la sala: ' + m);
  }
}

// ---- OAuth connect ----
if (BTN_CONNECT) {
  BTN_CONNECT.addEventListener('click', () => {
    // Dile al Edge Function a qué dashboard volver tras autorizar en Twitch,
    // ya que miguelium-wisdom y goal-overlay comparten la misma función.
    // Pasamos la URL del directorio (sin dashboard.html) para que la función
    // pueda construir la URL completa correctamente.
    const redirect = new URL('.', location.href).href;
    const authUrl = `${TWITCH_OAUTH_BASE}/authorize?redirect=${encodeURIComponent(redirect)}`;
    location.href = authUrl;
  });
}

BTN_COPY_URL.addEventListener('click', async () => {
  if (!broadcasterId) { flash('Conecta tu cuenta de Twitch primero'); return; }
  await copyText(buildOverlayUrl(broadcasterId));
  flash('URL de OBS copiada');
});

// ---- Logout ----
if (BTN_LOGOUT) {
  BTN_LOGOUT.addEventListener('click', async () => {
    if (!broadcasterId) return;
    // Notificar al overlay que se desconectó (si hay sala activa).
    try {
      if (roomBridge && roomActive) {
        roomBridge.sendDisconnect();
      } else if (configured()) {
        const tmp = createBridge(broadcasterId);
        await tmp.connect();
        tmp.sendDisconnect();
        await tmp.leave();
      }
    } catch (e) {
      console.warn('[dashboard] send disconnect failed', e?.message ?? e);
    }
    // Cerrar puente de tiempo real y marcar como inactivo para que el botón Test deje de funcionar.
    try {
      if (roomBridge) { await roomBridge.leave(); roomBridge = null; }
    } catch (e) { console.warn('[dashboard] leave bridge failed', e?.message ?? e); }
    roomActive = false;
    try {
      await fetch(`${TWITCH_OAUTH_BASE}/revoke?broadcaster_id=${encodeURIComponent(broadcasterId)}`, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${SUPABASE_KEY}`,
        },
      });
    } catch (e) {
      console.warn('[dashboard] revoke token failed', e?.message ?? e);
    }
    // Clear local session
    localStorage.removeItem('mw_broadcaster_id');
    localStorage.removeItem('mw_broadcaster_login');
    broadcasterId = '';
    broadcasterLogin = '';
    showConnected(false);
    BTN_CONNECT.hidden = false;
    flash('Sesión cerrada');
  });
}

// Inicializa controles con los ajustes guardados y los sincroniza con el
// overlay cuando hay sala activa.
applySettingsToControls();
wireAllControls();
if (roomBridge && roomActive) broadcastSettings();

// Otra pestaña del panel cambio un ajuste de un personaje: sincroniza la
// memoria y los controles de esta pestaña para no difundir valores viejos.
window.addEventListener('storage', (e) => {
  if (!e.key) return;
  // mwchar_<broadcaster>_<character>_<setting>
  const m = /^mwchar_(?:(.+)_)?(miguelium|ms-rowlet)_(amount|font|fontSize|movement|palette|flip)$/.exec(e.key);
  if (!m) return;
  const s = readSettings();
  settings[CHARACTER_MIGUELIUM] = s[CHARACTER_MIGUELIUM];
  settings[CHARACTER_ROWLET] = s[CHARACTER_ROWLET];
  applySettingsToControls();
  // No tocar el control que el usuario esta editando ahora mismo.
  for (const c of [CHARACTER_MIGUELIUM, CHARACTER_ROWLET]) {
    if (document.activeElement === ctrl(c, 'amount')) continue;
    if (document.activeElement === ctrl(c, 'font')) continue;
    if (document.activeElement === ctrl(c, 'font-size')) continue;
    if (document.activeElement === ctrl(c, 'movement')) continue;
    if (document.activeElement === ctrl(c, 'palette')) continue;
    if (document.activeElement === ctrl(c, 'flip')) continue;
  }
  if (roomBridge && roomActive) broadcastSettings();
});

// Mute del preview: el panel guarda el estado y el overlay solo obedece.
// Se reenvia al cargar el iframe para que un reload no pierda el mudo.
function sendMute() {
  const win = PREVIEW.contentWindow;
  if (win) win.postMessage({ type: 'mute', value: MUTE_PREVIEW.checked }, '*');
}

MUTE_PREVIEW.checked = savedPreviewMute();
MUTE_PREVIEW.addEventListener('change', () => {
  savePreviewMute(MUTE_PREVIEW.checked);
  sendMute();
});
PREVIEW.addEventListener('load', sendMute);

setInterval(() => {
  if (roomActive && Date.now() - lastHello > OVERLAY_TTL) setOverlay('', 'Overlay sin conexion');
}, 5000);

// ---- Inicio: manejar callback de OAuth o restaurar sesion ----
// Carga los ajustes por personaje de la nube y los combina con lo local.
async function loadCloudSettings(broadcasterId) {
  const rows = await fetchCharacterState(broadcasterId);
  if (!rows || !Array.isArray(rows)) return;
  const cloud = {};
  for (const row of rows) cloud[row.character] = row;
  let changed = false;
  for (const c of [CHARACTER_MIGUELIUM, CHARACTER_ROWLET]) {
    const cs = cloud[c];
    if (cs && Number.isFinite(cs.amount) && cs.amount > 0) {
      settings[c].amount = Math.floor(cs.amount);
      if (cs.font) settings[c].font = cs.font;
      if (cs.fontSize) settings[c].fontSize = Number(cs.fontSize);
      if (cs.movement) settings[c].movement = cs.movement;
      if (cs.palette) settings[c].palette = cs.palette;
      if (typeof cs.flip === 'boolean') settings[c].flip = cs.flip;
      changed = true;
      saveAllSettings(broadcasterId || '', c, settings[c]);
    }
  }
  if (changed) applySettingsToControls();
}

async function init() {
  const urlParams = new URLSearchParams(location.search);
  const connected = urlParams.get('connected');
  const broadcasterIdFromUrl = urlParams.get('broadcaster_id');
  const error = urlParams.get('error');

  if (error) {
    flash('Conexion Twitch fallo: ' + error, 'err');
    window.history.replaceState({}, document.title, location.pathname);
  }

  if (connected && broadcasterIdFromUrl) {
    broadcasterLogin = connected;
    broadcasterId = broadcasterIdFromUrl;
    localStorage.setItem('mw_broadcaster_id', broadcasterId);
    localStorage.setItem('mw_broadcaster_login', broadcasterLogin);
    showConnected(true);
    applySettingsToControls();
    try { await loadCloudSettings(broadcasterId); } catch (e) {
      console.warn('[dashboard] cloud character state unavailable', e?.message ?? e);
    }
    startRoom();
    updatePreview();
    window.history.replaceState({}, document.title, location.pathname);
    return;
  }

  // Restaurar sesion desde localStorage
  const savedId = localStorage.getItem('mw_broadcaster_id');
  const savedLogin = localStorage.getItem('mw_broadcaster_login');
  if (savedId) {
    broadcasterId = savedId;
    broadcasterLogin = savedLogin || '';
    showConnected(true);
    applySettingsToControls();
    try { await loadCloudSettings(broadcasterId); } catch (e) {
      console.warn('[dashboard] cloud character state unavailable', e?.message ?? e);
    }
  }

  if (broadcasterId) {
    startRoom();
  }
  updatePreview();
}

init();

window.addEventListener('beforeunload', () => {
  if (broadcasterId) localStorage.setItem('mw_broadcaster_id', broadcasterId);
  if (broadcasterLogin) localStorage.setItem('mw_broadcaster_login', broadcasterLogin);
});
</script>
